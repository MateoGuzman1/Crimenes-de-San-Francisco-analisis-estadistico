# tox automatiza el ciclo completo: entrenar → testear → verificar calidad de codigo
# Instalar con: pip install tox  (verificar version 4+)
# Uso:
#   tox                        → corre test_package + checks
#   tox -e test_package        → solo entrena y corre tests
#   tox -e train               → solo entrena el modelo
#   tox -e checks              → solo linting y type checking

[tox]
min_version = 4
envlist = test_package, checks
skipsdist = True

[testenv]
basepython = python
install_command = pip install {opts} {packages}
allowlist_externals = train

setenv =
    PYTHONPATH = package-src
    PYTHONHASHSEED = 0

[testenv:test_package]
envdir = {toxworkdir}/test_package
deps =
    -r{toxinidir}/requirements/test_requirements.txt
commands =
    python -m sfcrime_model.train_pipeline
    pytest \
    -s \
    -vv \
    {posargs:tests/}

[testenv:train]
envdir = {toxworkdir}/test_package
deps =
    {[testenv:test_package]deps}
commands =
    python -m sfcrime_model.train_pipeline

[testenv:checks]
envdir = {toxworkdir}/checks
deps =
    -r{toxinidir}/requirements/typing_requirements.txt
commands =
    flake8 package-src/sfcrime_model tests
    isort package-src/sfcrime_model tests
    {posargs:mypy package-src/sfcrime_model}

[flake8]
exclude = .git,env,.venv
max-line-length = 100
