services:

  api:
    build:
      context: ./api_crimes_san_francisco
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - MOCK_MODE=true
    depends_on:
      - api
    restart: unless-stopped
