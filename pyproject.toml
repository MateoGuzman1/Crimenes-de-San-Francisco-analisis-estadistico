[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfcrime-model"
version = "0.1.0"
description = "Pipeline MLOps de clasificacion multiclase de crimenes en San Francisco"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0,<2.0.0",
  "pandas>=2.0.0,<3.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "mlflow>=3.0.0,<4.0.0",
  "pyyaml>=6.0.0,<7.0.0",
  "joblib>=1.3.0,<2.0.0",
  "matplotlib>=3.7.0,<4.0.0",
  "xgboost>=2.0.0,<4.0.0",
  "pydantic>=2.0.0,<3.0.0",
]

[tool.setuptools]
package-dir = {"" = "package-src"}

[tool.setuptools.packages.find]
where = ["package-src"]

[tool.setuptools.package-data]
sfcrime_model = ["VERSION", "config.yml", "trained/*.pkl", "trained/label_classes.npy"]

[project.scripts]
sfcrime-train = "sfcrime_model.train_pipeline:run_training"

[tool.pytest.ini_options]
minversion = "2.0"
addopts = "-rfEX -p pytester --strict-markers"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test", "Acceptance"]
python_functions = ["test"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:The distutils package is deprecated:DeprecationWarning",
    "ignore::pytest.PytestExperimentalApiWarning",
    "ignore::_pytest.warning_types.PytestUnknownMarkWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
target-version = ['py310']
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
lines_between_sections = 1
skip = "migrations"
